<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Package Watcher</title>
<style>
  :root {
    --bg: #F6F7F8; --surface: #FFFFFF; --surface-2: #F1F2F4; --ink: #111418; --muted: #68707A;
    --line: rgba(17, 20, 24, .09); --line-strong: rgba(17, 20, 24, .18);
    --green: #1F8A5B; --amber: #C96A1B; --red: #C83E37; --blue: #2B63D9;
    --status: var(--green);
    --r-lg: 16px; --r: 12px; --r-sm: 8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D1014; --surface: #15191F; --surface-2: #1C2129; --ink: #ECEFF2; --muted: #8B949E;
      --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .18);
      --green: #38B37C; --amber: #E88B3E; --red: #E55C54; --blue: #5C8DF0;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .wrap { max-width: 1020px; margin: 0 auto; padding: 20px 20px 48px; display: grid; gap: 16px; }

  /* Header */
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 4px; }
  .brand { font-size: 16px; font-weight: 600; letter-spacing: -.01em; margin-right: 4px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px;
    border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    font-size: 13px; font-weight: 500; margin-right: auto;
  }
  .status-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--status); }

  .btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: var(--r-sm); padding: 6px 12px; font-size: 13px; font-weight: 500;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: transparent; }
  .btn.primary:hover { opacity: .88; background: var(--ink); }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .45; cursor: wait; }
  select.btn { padding-right: 10px; }

  /* Grid & Cards */
  .grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 16px; align-items: start; }
  .stack { display: grid; gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 18px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }

  /* Package Card */
  .pkg-empty { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .pkg-active { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: start; }
  .pkg-thumb {
    width: 84px; aspect-ratio: 4/3; object-fit: cover; border-radius: var(--r-sm);
    background: var(--surface-2); cursor: zoom-in; display: block;
  }
  .pkg-meta { font-size: 13px; font-weight: 600; color: var(--amber); }
  .pkg-desc { margin: 3px 0 6px; font-size: 14px; }
  .pkg-advice {
    background: var(--surface-2); border-radius: var(--r-sm); padding: 9px 11px;
    font-size: 13px; line-height: 1.45;
  }
  .pkg-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pkg-notes { font-size: 12px; color: var(--muted); }

  /* Temperature */
  .temp-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .temp-val { font-size: 32px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
  .temp-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-sm); padding: 2px; gap: 2px; }
  .seg button {
    border: 0; background: none; border-radius: 6px; padding: 3px 9px;
    font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer;
  }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  #t-chart { width: 100%; height: 76px; display: block; margin: 12px 0 8px; overflow: visible; }
  .temp-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; flex-wrap: wrap; }

  /* Camera & Buzzer */
  .cam-box {
    position: relative; aspect-ratio: 4/3; border-radius: var(--r); overflow: hidden;
    background: #0B0D10; border: 1px solid var(--line);
  }
  .cam-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam-off { position: absolute; inset: 0; display: grid; place-items: center; color: #8B949E; font-size: 13px; }
  .cam-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .buzz-bar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--line);
  }
  .buzz-bar input[type=range] { width: 88px; accent-color: var(--ink); margin-left: auto; }

  /* Ask Agent */
  .chat { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; margin-bottom: 12px; }
  .chat:empty { display: none; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.q { align-self: flex-end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 4px; }
  .msg.a { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
  .msg.err { color: var(--red); }
  .msg.thinking { color: var(--muted); }
  .msg .shot { margin-top: 8px; width: min(240px, 100%); border-radius: var(--r-sm); display: block; cursor: zoom-in; }
  .confirm { display: flex; gap: 8px; margin-top: 8px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    border: 1px solid var(--line); background: none; border-radius: 999px;
    padding: 4px 11px; font-size: 12px; color: var(--muted); cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .chip:hover { color: var(--ink); border-color: var(--line-strong); }
  .chip.on { background: var(--ink); color: var(--bg); border-color: transparent; }

  .ask-form { display: flex; gap: 8px; }
  .ask-form input {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 9px 12px; font-size: 14px;
  }
  .ask-form input:focus { outline: none; border-color: var(--line-strong); background: var(--surface); }

  /* History */
  .hist-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .hist-head .card-title { margin-right: auto; }
  .ev-list { list-style: none; margin: 0; padding: 0; }
  .ev {
    display: grid; grid-template-columns: 56px 56px 1fr; gap: 12px; align-items: center;
    padding: 10px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: var(--r-sm);
  }
  .ev:first-child { border-top: 0; }
  .ev:hover { background: var(--surface-2); }
  .ev-time { font-size: 12px; color: var(--muted); text-align: right; }
  .ev-photo { width: 56px; aspect-ratio: 4/3; border-radius: 6px; object-fit: cover; background: var(--surface-2); display: block; }
  .ev-photo.none { display: grid; place-items: center; font-size: 11px; color: var(--muted); }
  .ev-top { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .ev-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--k); flex: none; }
  .ev-desc { margin: 2px 0 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { margin-top: 10px; }

  footer { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 4px 2px; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--ink); }

  /* Modal & Toast */
  dialog { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 0; max-width: min(760px, 94vw); background: var(--surface); color: var(--ink); overflow: hidden; }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog img { width: 100%; display: block; max-height: 65vh; object-fit: contain; background: #0B0D10; }
  dialog .body { padding: 16px 18px; }
  dialog .close { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px; cursor: pointer; }
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 10px);
    background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 500; opacity: 0; visibility: hidden; transition: opacity .18s, transform .18s; z-index: 9;
  }
  #toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 520px) {
    .pkg-active { grid-template-columns: 1fr; }
    .ev { grid-template-columns: 48px 48px 1fr; gap: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Package Watcher</div>
    <span class="status-pill"><i></i><span id="mode-text">Connecting…</span></span>
    <select id="snooze" class="btn" aria-label="Snooze alerts">
      <option value="">Snooze</option>
      <option value="30">30 min</option>
      <option value="60">1 hour</option>
      <option value="240">4 hours</option>
      <option value="0">Resume</option>
    </select>
    <button class="btn primary" id="btn-snap">Snapshot</button>
  </header>

  <div class="grid">
    <div class="stack">
      <section class="card">
        <div class="card-head">
          <h2 class="card-title">Package</h2>
          <span class="muted" id="today-summary"></span>
        </div>
        <div class="pkg-empty" id="pkg-empty">
          <span class="muted">No package outside.</span>
        </div>
        <div class="pkg-active" id="pkg-active" hidden>
          <img class="pkg-thumb" id="pkg-img" alt="Package">
          <div>
            <div class="pkg-meta" id="pkg-title"></div>
            <div class="pkg-desc" id="pkg-desc"></div>
            <div class="pkg-advice" id="pkg-advice"></div>
            <div class="pkg-foot">
              <span class="pkg-notes" id="pkg-notes"></span>
              <button class="btn primary sm" id="btn-picked">Mark picked up</button>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title">Outdoor temp</h2>
          <div class="seg" role="group" aria-label="Range">
            <button class="on" data-h="24">24h</button>
            <button data-h="168">7d</button>
          </div>
        </div>
        <div class="temp-row">
          <div>
            <div class="temp-val" id="t-now">–</div>
            <div class="temp-sub" id="t-sub">No reading</div>
          </div>
        </div>
        <svg id="t-chart" viewBox="0 0 400 76" preserveAspectRatio="none" aria-label="Temperature chart"></svg>
        <div class="temp-foot">
          <span id="t-range">–</span>
          <span id="t-cpu"></span>
        </div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">Camera</h2>
        <button class="btn sm" id="btn-live">Start live</button>
      </div>
      <div class="cam-box">
        <img id="live-img" alt="Live camera" hidden>
        <div class="cam-off" id="live-off">Live view paused</div>
      </div>
      <div class="buzz-bar" id="buzz-row" hidden>
        <span class="muted">Buzzer</span>
        <button class="btn sm" data-buzz="beep">Beep</button>
        <button class="btn sm" data-buzz="alarm">Alarm</button>
        <button class="btn sm" data-buzz="off">Stop</button>
        <input type="range" id="buzz-vol" min="5" max="100" step="5" value="60" aria-label="Buzzer volume">
        <span class="muted" id="buzz-vol-val">60%</span>
      </div>
    </section>
  </div>

  <section class="card">
    <div class="card-head">
      <h2 class="card-title">Ask agent</h2>
      <span class="muted">Tell it what's inside for better advice</span>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="chips">
      <button class="chip sug">Should I bring it inside?</button>
      <button class="chip sug">It has chocolate inside</button>
      <button class="chip sug">It's just paper towels</button>
      <button class="chip sug">Any deliveries today?</button>
      <button class="chip sug">How hot did it get today?</button>
    </div>
    <form class="ask-form" id="ask-form">
      <input id="ask-q" maxlength="300" autocomplete="off" placeholder="Ask if you should bring it in, or share what's inside…" aria-label="Ask agent">
      <button class="btn primary" id="ask-btn">Ask</button>
    </form>
  </section>

  <section class="card">
    <div class="hist-head">
      <h2 class="card-title">History</h2>
      <button class="chip flt on" data-f="all">All</button>
      <button class="chip flt" data-f="delivered">Delivered</button>
      <button class="chip flt" data-f="picked_up">Picked up</button>
      <button class="chip flt" data-f="temp_alert">Alerts</button>
      <input type="date" id="day" class="btn sm" aria-label="Filter by date">
    </div>
    <ul class="ev-list" id="timeline"></ul>
    <button class="btn sm more" id="btn-more" hidden>Show more</button>
  </section>

  <footer>
    <span id="meta"></span>
    <a href="/label">Label photos</a>
  </footer>
</div>

<dialog id="dlg">
  <button class="close" onclick="dlg.close()" aria-label="Close">✕</button>
  <img id="dlg-img" alt="">
  <div class="body">
    <strong id="dlg-kind"></strong> <span class="muted" id="dlg-time"></span>
    <p id="dlg-desc" style="margin:8px 0 4px"></p>
    <p id="dlg-advice" class="muted" style="margin:4px 0"></p>
    <div class="muted" id="dlg-meta" style="font-size:12px"></div>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
const KIND = {
  delivered:  {label: "Delivered",  color: "var(--amber)"},
  picked_up:  {label: "Picked up",  color: "var(--green)"},
  temp_alert: {label: "Temp alert", color: "var(--red)"},
  snapshot:   {label: "Snapshot",   color: "var(--blue)"},
  answer:     {label: "Answer",     color: "var(--muted)"},
};
let filter = "all", day = "", liveTimer = null, tempHours = 24, shown = 15, volDragging = false;
const $ = id => document.getElementById(id);
const cToF = c => Math.round((c * 9 / 5 + 32) * 10) / 10;
const fmtTime = iso => new Date(iso).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
const fmtDay = iso => new Date(iso).toLocaleDateString([], {month: "short", day: "numeric"});
const clock = hhmm => { const [h, m] = hhmm.split(":").map(Number); const d = new Date(); d.setHours(h, m); return fmtTime(d); };

async function api(path, body) {
  const opts = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const r = await fetch(path, opts);
  if (r.status === 401) { document.body.innerHTML = "<p style='padding:24px'>Session expired. Open the dashboard link with ?key=… again.</p>"; throw new Error("401"); }
  return r.json();
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
}

function renderStatus(s) {
  const snoozed = !!s.snoozed_until, pkg = s.active_package;
  const color = snoozed ? "var(--blue)" : pkg ? "var(--amber)" : "var(--green)";
  document.documentElement.style.setProperty("--status", color);
  $("mode-text").textContent = snoozed ? `Snoozed until ${clock(s.snoozed_until)}`
    : pkg ? `Outside · ${pkg.outside_minutes}m` : "Clear";

  $("today-summary").textContent = `${s.today.deliveries} today`;
  $("pkg-empty").hidden = !!pkg;
  $("pkg-active").hidden = !pkg;
  if (pkg) {
    $("pkg-img").hidden = !pkg.image;
    if (pkg.image) {
      $("pkg-img").src = `/thumbs/${encodeURIComponent(pkg.image)}`;
      $("pkg-img").onclick = () => openEvent({kind: "delivered", time: pkg.arrived_at, image: pkg.image, description: pkg.description, advice: pkg.advice, temp_f: pkg.temp_f, humidity: pkg.humidity, notes: pkg.notes});
    }
    $("pkg-title").textContent = `Arrived ${fmtTime(pkg.arrived_at)} · ${pkg.outside_minutes}m ago`;
    $("pkg-desc").textContent = pkg.description || "Package detected";
    $("pkg-advice").textContent = pkg.advice || "Ask the agent if you should bring it in.";
    $("pkg-notes").textContent = pkg.notes ? `Note: ${pkg.notes}` : "";
  }

  const t = s.temperature;
  $("t-now").textContent = t ? `${t.f}°F` : "–";
  $("t-sub").textContent = t ? `${t.c}°C · ${t.humidity}% humidity` : "Sensor offline";
  $("t-cpu").textContent = s.cpu_c != null ? `Pi ${cToF(s.cpu_c)}°F` : "";

  const b = s.buzzer;
  $("buzz-row").hidden = !b;
  if (b && b.volume != null && !volDragging) {
    const pct = Math.round(b.volume * 100);
    $("buzz-vol").value = pct; $("buzz-vol-val").textContent = `${pct}%`;
  }
  $("meta").textContent = s.last_event ? `Last event ${clock(s.last_event)}` : "";
}

function openEvent(e) {
  const k = KIND[e.kind] || KIND.snapshot;
  $("dlg-img").hidden = !e.image;
  if (e.image) $("dlg-img").src = `/photos/${encodeURIComponent(e.image)}`;
  $("dlg-kind").textContent = k.label; $("dlg-kind").style.color = k.color;
  $("dlg-time").textContent = `${fmtDay(e.time)}, ${fmtTime(e.time)}`;
  $("dlg-desc").textContent = e.description || "";
  $("dlg-advice").textContent = e.advice || "";
  $("dlg-advice").hidden = !e.advice;
  const temp = e.temp_f != null ? `${e.temp_f}°F · ${e.humidity ?? "?"}%` : "";
  $("dlg-meta").textContent = [temp, e.notes ? `Note: ${e.notes}` : ""].filter(Boolean).join(" · ");
  $("dlg").showModal();
}

async function loadEvents() {
  const events = await api(`/api/events?filter=${filter}${day ? `&day=${day}` : ""}`);
  const tl = $("timeline"); tl.innerHTML = "";
  $("btn-more").hidden = events.length <= shown;
  if (!events.length) {
    tl.innerHTML = `<li class="muted" style="padding:12px 0">No events yet.</li>`;
    return;
  }
  for (const e of events.slice(0, shown)) {
    const k = KIND[e.kind] || KIND.snapshot;
    const li = document.createElement("li"); li.className = "ev"; li.tabIndex = 0; li.style.setProperty("--k", k.color);
    li.innerHTML = `<span class="ev-time"></span>` +
      (e.image ? `<img class="ev-photo" loading="lazy" alt="">` : `<span class="ev-photo none">–</span>`) +
      `<div style="min-width:0"><div class="ev-top"><i class="ev-dot"></i><span></span></div><p class="ev-desc"></p></div>`;
    li.querySelector(".ev-time").textContent = `${fmtDay(e.time)} ${fmtTime(e.time)}`;
    if (e.image) li.querySelector("img").src = `/thumbs/${encodeURIComponent(e.image)}`;
    li.querySelector(".ev-top span").textContent = k.label + (e.temp_f != null ? ` · ${e.temp_f}°F` : "");
    li.querySelector(".ev-desc").textContent = e.advice || e.description || e.reason || "";
    li.onclick = () => openEvent(e);
    li.onkeydown = ev => { if (ev.key === "Enter") openEvent(e); };
    tl.appendChild(li);
  }
}

async function loadTemp() {
  const pts = (await api(`/api/temperature?hours=${tempHours}`)).sort((a, b) => a.t - b.t);
  const svg = $("t-chart");
  if (pts.length < 2) {
    svg.innerHTML = "";
    $("t-range").textContent = "Waiting for logged readings";
    return;
  }
  const fs = pts.map(p => cToF(p.c)), lo = Math.min(...fs), hi = Math.max(...fs), pad = Math.max((hi - lo) * 0.15, 0.5);
  const y0 = lo - pad, y1 = hi + pad, t0 = pts[0].t, dt = Math.max(pts.at(-1).t - t0, 1);
  const X = t => (t - t0) / dt * 400, Y = f => 70 - (f - y0) / (y1 - y0) * 62;
  const line = pts.map((p, i) => `${X(p.t).toFixed(1)},${Y(fs[i]).toFixed(1)}`).join(" ");
  const avg = (fs.reduce((a, b) => a + b, 0) / fs.length).toFixed(1);
  svg.innerHTML =
    `<polygon points="0,76 ${line} 400,76" fill="var(--amber)" opacity=".10"/>` +
    `<polyline points="${line}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  $("t-range").textContent = `Low ${lo}°F · Avg ${avg}°F · High ${hi}°F`;
}

async function refresh() {
  try { renderStatus(await api("/api/status")); await loadEvents(); await loadTemp(); } catch (e) { console.warn(e); }
}

function bubble(cls, text) {
  const el = document.createElement("div"); el.className = `msg ${cls}`; el.textContent = text;
  $("chat").appendChild(el); $("chat").scrollTop = $("chat").scrollHeight; return el;
}

async function ask(question) {
  question = question.trim();
  if (!question || $("ask-btn").disabled) return;
  $("ask-q").value = ""; $("ask-btn").disabled = true;
  bubble("q", question);
  const el = bubble("a thinking", "Thinking…");
  try {
    const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question})});
    const data = await r.json().catch(() => ({error: `Error ${r.status}`}));
    el.className = "msg a";
    if (!r.ok || data.error) { el.classList.add("err"); el.textContent = data.error || `Error ${r.status}`; return; }
    el.textContent = data.answer;
    if (data.image) {
      const img = document.createElement("img"); img.className = "shot"; img.alt = "Camera";
      img.onload = () => { $("chat").scrollTop = $("chat").scrollHeight; };
      img.src = `/photos/${encodeURIComponent(data.image)}`;
      img.onclick = () => openEvent({kind: "answer", time: new Date().toISOString(), image: data.image, description: data.answer});
      el.appendChild(img);
    }
    if (data.pending) {
      const row = document.createElement("div"); row.className = "confirm";
      for (const [label, reply, cls] of [["Confirm", "yes", "btn primary sm"], ["Cancel", "no", "btn sm"]]) {
        const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.className = cls;
        b.onclick = () => { row.remove(); ask(reply); };
        row.appendChild(b);
      }
      el.appendChild(row);
    }
    if ((data.tool_calls || []).some(c => ["done", "confirmed"].includes(c.status))) refresh();
  } catch (err) {
    el.className = "msg a err"; el.textContent = "Couldn't reach the Pi.";
  } finally {
    $("ask-btn").disabled = false; $("chat").scrollTop = $("chat").scrollHeight;
  }
}

$("ask-form").onsubmit = ev => { ev.preventDefault(); ask($("ask-q").value); };
document.querySelectorAll(".sug").forEach(b => b.onclick = () => ask(b.textContent));
$("btn-picked").onclick = async () => { renderStatus(await api("/api/picked_up", {})); await loadEvents(); toast("Marked picked up"); };
$("btn-snap").onclick = async () => { await api("/api/snapshot", {}); toast("Snapshot queued"); setTimeout(refresh, 3500); };
$("snooze").onchange = async ev => {
  if (ev.target.value === "") return;
  const m = Number(ev.target.value);
  renderStatus(await api("/api/snooze", {minutes: m}));
  toast(m ? `Snoozed ${m}m` : "Alerts resumed");
  ev.target.value = "";
};
document.querySelectorAll("[data-buzz]").forEach(btn => btn.onclick = async () => {
  try {
    const d = await api("/api/buzzer", {action: btn.dataset.buzz});
    if (d.error) return toast(d.error);
    renderStatus(d); toast(btn.dataset.buzz === "off" ? "Buzzer off" : `Buzzer: ${btn.dataset.buzz}`);
  } catch (e) { toast("Buzzer unavailable"); }
});
$("buzz-vol").oninput = e => { volDragging = true; $("buzz-vol-val").textContent = `${e.target.value}%`; };
$("buzz-vol").onchange = async e => {
  try {
    await api("/api/buzzer", {action: "volume", volume: Number(e.target.value)});
    await api("/api/buzzer", {action: "beep"});
    toast(`Volume ${e.target.value}%`);
  } catch (err) { toast("Buzzer unavailable"); }
  volDragging = false;
};
document.querySelectorAll(".flt").forEach(c => c.onclick = () => {
  document.querySelectorAll(".flt").forEach(x => x.classList.toggle("on", x === c));
  filter = c.dataset.f; shown = 15; loadEvents();
});
$("day").onchange = e => { day = e.target.value; shown = 15; loadEvents(); };
$("btn-more").onclick = () => { shown += 15; loadEvents(); };
document.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-h]").forEach(x => x.classList.toggle("on", x === b));
  tempHours = Number(b.dataset.h); loadTemp();
});
function setLive(on) {
  clearInterval(liveTimer); liveTimer = null;
  $("live-img").hidden = !on; $("live-off").hidden = on;
  $("btn-live").textContent = on ? "Pause live" : "Start live";
  if (on) {
    const tick = () => { $("live-img").src = `/api/live.jpg?t=${Date.now()}`; };
    tick(); liveTimer = setInterval(tick, 1000);
  }
}
$("btn-live").onclick = () => setLive(!liveTimer);
document.addEventListener("visibilitychange", () => { if (document.hidden) setLive(false); else refresh(); });

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 10000);
</script>
</body>
